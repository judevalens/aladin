server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # One target per service log so `service` distinguishes api / worker / mcp — previously every
  # file was labelled job=aladin-worker, so api/mcp errors were mis-attributed to the worker.
  - job_name: aladin
    static_configs:
      - targets: [localhost]
        labels: { job: aladin, service: api, env: local, __path__: /var/log/aladin/api.log }
      - targets: [localhost]
        labels: { job: aladin, service: worker, env: local, __path__: /var/log/aladin/worker.log }
      - targets: [localhost]
        labels: { job: aladin, service: mcp, env: local, __path__: /var/log/aladin/mcp.log }
    pipeline_stages:
      - json:
          expressions:
            ts: time
            level: level
            component: component
            task_type: task_type
            provider: provider
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
          component:
          task_type:
          provider:
