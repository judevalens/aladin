server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: aladin-worker
    static_configs:
      - targets:
          - localhost
        labels:
          job: aladin-worker
          env: local
          __path__: /var/log/aladin/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: time
            level: level
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
