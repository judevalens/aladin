<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable pin WKWebView's NATIVE page zoom (respected there,
         unlike Safari): a palm+Pencil pinch on the board otherwise zooms the whole page
         into a blank corner of dark canvas — "the board disappeared" (device, 2026-08-22).
         Surface-level zoom (the board camera, PDF pages) is the app's own, in JS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Aladin — page editor</title>
  </head>
  <body>
    <!-- Built as a self-contained document and shipped inside the iPad app; the host
         injects window.__ALADIN_EMBED__ before this loads. -->
    <div id="root"></div>
    <script type="module" src="/src/embed/editor-entry.tsx"></script>
  </body>
</html>
