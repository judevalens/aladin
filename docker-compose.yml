services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aladin-postgres
    environment:
      POSTGRES_DB: aladin
      POSTGRES_USER: aladin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: aladin-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: aladin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Shard-owned documents. A single-node replica set keeps transactions and
  # change streams available while remaining a normal `make db-up` dependency.
  mongo:
    image: mongo:8.0.16
    container_name: aladin-shard-mongo
    command: ["mongod", "--replSet", "shard-rs", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - shard_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: mongo:8.0.16
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["mongosh", "mongodb://mongo:27017/admin", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'shard-rs',members:[{_id:0,host:'mongo:27017'}]}) }"]

  loki:
    image: grafana/loki:3.0.0
    container_name: aladin-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    container_name: aladin-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/aladin
      - promtail_positions:/var/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    container_name: aladin-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  blocknote:
    build: ./services/blocknote
    container_name: aladin-blocknote
    # Opt-in only: excluded from a plain `docker compose up -d` (and thus from
    # `make backend`). Run the sidecar locally with `make blocknote` instead.
    # To use the container: `docker compose --profile collab up -d blocknote`.
    profiles: ["collab"]
    ports:
      - "3500:3500"   # converter (HTTP)
      - "3501:3501"   # collab (Hocuspocus WS)
      - "3502:3502"   # board sync (tldraw rooms WS)
    environment:
      PORT: 3500
      COLLAB_PORT: 3501
      # Room SQLite files are container-ephemeral by design: a fresh container
      # re-seeds every room from artifacts.content (the projection).
      BOARD_SYNC_PORT: 3502
      # In-network Postgres for Hocuspocus page_ydoc persistence.
      BLOCKNOTE_DATABASE_URL: postgres://aladin:password@postgres:5432/aladin
      # Go API runs on the host (make backend), not in compose — reach it via
      # the docker host gateway.
      BLOCKNOTE_AUTH_RESOLVE_URL: http://host.docker.internal:8000/api/auth/resolve
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3500/healthz"]
      interval: 10s
      timeout: 2s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  shard_mongo_data:
  loki_data:
  grafana_data:
  promtail_positions:
