<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aladin_compose</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link type="text/css" rel="stylesheet" href="artifact-spa/style.css">
    <style>
        .app-shell {
            color: #111111;
            background: red;
            font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
            line-height: 1.5;
            font-weight: 400;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .aladin-artifact-spa-host,
        .aladin-artifact-spa-host * {
            box-sizing: border-box;
        }

        .aladin-artifact-spa-host {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }


        .aladin-artifact-spa-host code {
            font-family: "SFMono-Regular", "Menlo", monospace;
            font-size: 0.92em;
        }

        .aladin-artifact-spa-host .app-shell {
            min-height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .aladin-artifact-spa-host .hero-card,
        .aladin-artifact-spa-host .panel {
            border: 1px solid #ddd6ca;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }

        .aladin-artifact-spa-host .hero-card {
            padding: 28px;
            border-radius: 18px;
        }

        .aladin-artifact-spa-host .hero-card h1 {
            margin: 10px 0 12px;
            font-size: clamp(2rem, 4vw, 3.4rem);
            line-height: 0.95;
            letter-spacing: -0.05em;
        }

        .aladin-artifact-spa-host .hero-card p,
        .aladin-artifact-spa-host .panel p {
            margin: 0;
            max-width: 58ch;
            color: #5a564f;
            font-size: 1rem;
        }

        .aladin-artifact-spa-host .eyebrow,
        .aladin-artifact-spa-host .panel-label {
            font-family: "SFMono-Regular", "Menlo", monospace;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            color: cyan;
        }

        .aladin-artifact-spa-host .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .aladin-artifact-spa-host .panel {
            border-radius: 16px;
            padding: 22px;
        }

        .aladin-artifact-spa-host .panel h2 {
            margin: 10px 0 8px;
            font-size: 1.35rem;
            line-height: 1.1;
        }

        @media (max-width: 760px) {
            .aladin-artifact-spa-host .app-shell {
                padding: 18px;
            }

            .aladin-artifact-spa-host .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="composeApp"></div>
<script type="application/javascript" src="aladin-bridge.js"></script>
<script type="application/javascript" src="artifact-spa/artifact-spa.js"></script>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
