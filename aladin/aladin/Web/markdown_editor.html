<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aladin Note Editor</title>
  <link rel="stylesheet" href="aladin-milkdown.bundle.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: transparent;
      --border: rgba(32, 34, 38, 0.12);
      --muted: rgba(60, 60, 67, 0.68);
      --text: #1d1d1f;
      --surface: rgba(255, 255, 255, 0.72);
      --toolbar: rgba(247, 247, 248, 0.84);
      --accent: #0a7f72;
      --caret: #0a7f72;
      --selection: rgba(10, 127, 114, 0.16);
      --danger: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --border: rgba(255, 255, 255, 0.12);
        --muted: rgba(235, 235, 245, 0.6);
        --text: #f5f5f7;
        --surface: rgba(28, 28, 30, 0.72);
        --toolbar: rgba(44, 44, 46, 0.84);
        --accent: #78dcca;
        --caret: #78dcca;
        --selection: rgba(120, 220, 202, 0.16);
        --danger: #ffb4ab;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    main {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    main {
      display: block;
    }

    .toolbar {
      display: none;
    }

    .status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    #editor {
      height: 100%;
      min-height: 100%;
      overflow: auto;
      background: transparent;
    }

    .editor-instance {
      height: 100%;
      min-height: 100%;
    }

    .editor-instance[hidden] {
      display: none;
    }

    .milkdown {
      min-height: 100%;
      background: transparent;
      color: var(--text);
      --crepe-color-background: transparent;
      --crepe-color-on-background: var(--text);
      --crepe-color-surface: var(--surface);
      --crepe-color-surface-low: var(--toolbar);
      --crepe-color-on-surface: var(--text);
      --crepe-color-on-surface-variant: var(--muted);
      --crepe-color-outline: var(--border);
      --crepe-color-primary: var(--accent);
      --crepe-color-secondary: var(--selection);
      --crepe-color-on-secondary: var(--text);
      --crepe-color-inverse: var(--text);
      --crepe-color-on-inverse: var(--surface);
      --crepe-color-inline-code: var(--accent);
      --crepe-color-error: var(--danger);
      --crepe-color-hover: var(--selection);
      --crepe-color-selected: var(--selection);
      --crepe-color-inline-area: var(--toolbar);
      --crepe-font-title: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --crepe-font-default: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --crepe-font-code: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
    }

    .milkdown .ProseMirror {
      min-height: 100vh;
      padding: 8px 2px 44px;
      outline: none;
      caret-color: var(--caret);
      font-size: 15px;
      line-height: 1.64;
    }

    .milkdown .ProseMirror-focused {
      --prosemirror-virtual-cursor-color: var(--caret);
    }

    .milkdown .ProseMirror .prosemirror-virtual-cursor {
      border-left-width: 2px;
    }

    .milkdown .ProseMirror-gapcursor::after {
      border-top-color: var(--caret);
      border-top-width: 2px;
    }

    .milkdown h1,
    .milkdown h2,
    .milkdown h3 {
      letter-spacing: 0;
    }

    .milkdown pre,
    .milkdown code {
      border-radius: 8px;
    }

    .aladin-audio-block {
      display: grid;
      gap: 6px;
      max-width: 520px;
      margin: 10px 0 16px;
      padding: 10px 0;
    }

    .aladin-audio-block audio {
      width: 100%;
      max-width: 520px;
      display: block;
    }

    .aladin-audio-caption {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .editor-error {
      margin: 24px;
      color: var(--danger);
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <div id="status" class="status">Loading editor...</div>
      <div class="hint">Markdown shortcuts supported</div>
    </div>
    <div id="editor"></div>
  </main>
  <script src="aladin-milkdown.bundle.js"></script>
</body>
</html>
