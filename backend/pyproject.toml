[tool.poetry]
name = "aladin-backend"
version = "0.1.0"
description = "Research assistant knowledge graph API"
authors = ["Jude"]
package-mode = false

[project]
name = "aladin-backend"
version = "0.1.0"
description = "Research assistant knowledge graph API"
authors = [
    {name = "Jude"}
]
requires-python = "^3.11"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-cors (>=6.0.2,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "neo4j (>=6.1.0,<7.0.0)",
    "pymupdf (>=1.27.2.2,<2.0.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "langchain (>=1.2.13,<2.0.0)",
    "langchain-openai (>=1.1.12,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-flask = "^1.3.0"

